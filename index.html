<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F4A">
<meta name="description" content="وينه: اكتب القطعة اللي تدوّرها، ومحلات صناعية المعبيلة ترسل لك أسعارها.">
<link rel="icon" href="img/head.webp" type="image/webp">
<link rel="apple-touch-icon" href="img/head.webp">
<title>وينه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
/* Waynah: royal navy + toasted caramel on warm paper. Phone = one app column. Laptop = brand stage beside the app. */
:root{
  --bg:#F6F0E5; --surface:#FFFFFF; --surface2:#F1E6D4; --fg:#12234D; --muted:#5A6580; --line:#E6DAC6;
  --primary:#17337A; --on-primary:#FFF8EE; --accent:#A4551A; --accent-soft:#FDEBD5; --caramel:#F29B3F; --caramel-2:#FFC37A;
  --good:#16834A; --good-soft:#DDF3E5; --bad:#C23B26; --bad-soft:#FBE3DE; --info-soft:#E4EAF8;
  --btn:linear-gradient(135deg,#2650B0 0%,#17337A 52%,#0E1F4A 100%);
  --btn-acc:linear-gradient(135deg,#FFB560 0%,#F29B3F 45%,#C8661F 100%);
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(255,170,80,.30) 0%,rgba(255,170,80,0) 55%),linear-gradient(150deg,#2A56BD 0%,#17337A 45%,#0B1940 100%);
  --sh1:0 1px 2px rgba(18,35,77,.05),0 10px 28px -12px rgba(18,35,77,.22);
  --sh2:0 2px 6px rgba(18,35,77,.06),0 24px 60px -20px rgba(18,35,77,.38);
  --glow:0 12px 28px -10px rgba(23,51,122,.65);
  --glow-acc:0 12px 28px -10px rgba(226,128,40,.75);
  --ring:0 0 0 4px rgba(242,155,63,.28);
  --dot:rgba(18,35,77,.07);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif; --f-body:'IBM Plex Sans Arabic','Readex Pro',Tahoma,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.3,1.5,.5,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080F22; --surface:#111B36; --surface2:#1A2749; --fg:#F4EEE3; --muted:#A5AFC6; --line:#24335A;
  --primary:#F29B3F; --on-primary:#0B1530; --accent:#FFB560; --accent-soft:#3A2614; --caramel:#F29B3F; --caramel-2:#FFC37A;
  --good:#5FD38E; --good-soft:#12301F; --bad:#FF8A73; --bad-soft:#3A1A16; --info-soft:#1B2A52;
  --btn:linear-gradient(135deg,#FFC37A 0%,#F29B3F 50%,#D8742A 100%);
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(255,170,80,.28) 0%,rgba(255,170,80,0) 55%),linear-gradient(150deg,#2A56BD 0%,#18357E 45%,#0D1C47 100%);
  --sh1:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); --sh2:0 30px 70px -20px rgba(0,0,0,.75);
  --glow:0 12px 28px -10px rgba(242,155,63,.6); --dot:rgba(255,255,255,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080F22; --surface:#111B36; --surface2:#1A2749; --fg:#F4EEE3; --muted:#A5AFC6; --line:#24335A;
  --primary:#F29B3F; --on-primary:#0B1530; --accent:#FFB560; --accent-soft:#3A2614; --caramel:#F29B3F; --caramel-2:#FFC37A;
  --good:#5FD38E; --good-soft:#12301F; --bad:#FF8A73; --bad-soft:#3A1A16; --info-soft:#1B2A52;
  --btn:linear-gradient(135deg,#FFC37A 0%,#F29B3F 50%,#D8742A 100%);
  --hero:radial-gradient(120% 90% at 100% 0%,rgba(255,170,80,.28) 0%,rgba(255,170,80,0) 55%),linear-gradient(150deg,#2A56BD 0%,#18357E 45%,#0D1C47 100%);
  --sh1:0 1px 2px rgba(0,0,0,.3),0 12px 30px -12px rgba(0,0,0,.6); --sh2:0 30px 70px -20px rgba(0,0,0,.75);
  --glow:0 12px 28px -10px rgba(242,155,63,.6); --dot:rgba(255,255,255,.05); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;
  -webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;overflow-x:hidden}
/* soft colour fields + dot texture behind everything */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
.bgfx i{position:absolute;border-radius:50%;will-change:transform;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:46vmax;height:46vmax;background:#FFB560;top:-18vmax;left:-14vmax;opacity:.35}
.bgfx i:nth-child(2){width:40vmax;height:40vmax;background:#3B6BE0;bottom:-20vmax;right:-12vmax;opacity:.22;animation-duration:28s}
.bgfx i:nth-child(3){width:22vmax;height:22vmax;background:#C8661F;top:40%;right:30%;opacity:.12;animation-duration:34s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{display:none;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand img{width:38px;height:38px;border-radius:12px;background:var(--hero);object-fit:contain;padding:2px;box-shadow:var(--glow)}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:700}
.switch{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);box-shadow:var(--sh1);border:1px solid var(--line)}
.switch a{position:relative;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;transition:color .25s,background .25s,box-shadow .25s}
.switch a:hover{color:var(--fg)}
.switch a[aria-current="page"]{background:var(--btn);color:#fff;box-shadow:var(--glow)}
.mode{display:flex;justify-content:center;margin:10px 0 4px}
.mode span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line);padding:4px 11px;border-radius:999px}
.mode span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:live 2s infinite}
.mode span.local::before{background:var(--caramel);animation:none}
.mode b{color:var(--accent)}
.mode em{font-style:normal;white-space:nowrap}.mode .lg{display:none}
.topbar .mode{margin:0;flex-shrink:0}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}

/* shell: phone = app only; laptop = stage + app */
.shell{max-width:1240px;margin:0 auto}
.stage{display:none}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wide{max-width:1180px;margin:0 auto}

/* surfaces */
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--sh1);border:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.soft{background:var(--surface2);border-radius:18px;padding:14px 16px}
.hero{position:relative;isolation:isolate;background:var(--hero);color:#FFF8EE;border-radius:26px;padding:20px;display:flex;align-items:flex-end;gap:12px;overflow:hidden;min-height:128px;box-shadow:var(--sh2)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;background-image:radial-gradient(rgba(255,255,255,.9) 1px,transparent 1.2px);background-size:16px 16px;-webkit-mask-image:linear-gradient(200deg,#000,transparent 70%);mask-image:linear-gradient(200deg,#000,transparent 70%)}
.hero .t{font-family:var(--f-display);font-weight:700;font-size:19px}
.hero p{margin:4px 0 0;font-size:13px;opacity:.86}
.hero>img{width:84px;height:auto;margin-bottom:-24px;flex-shrink:0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.hero h1{color:#FFF8EE}

/* buttons */
.btn{position:relative;overflow:hidden;min-height:48px;border-radius:15px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);
  box-shadow:0 1px 2px rgba(18,35,77,.06);transition:transform .18s var(--ease),box-shadow .25s,background .25s,border-color .25s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh1)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-primary{background:var(--btn);color:#fff;border-color:transparent;box-shadow:var(--glow)}
:root[data-theme="dark"] .btn-primary{color:#0B1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{color:#0B1530}}
.btn-primary:hover{box-shadow:0 16px 34px -12px rgba(23,51,122,.8)}
.btn-accent{background:var(--btn-acc);color:#2A1404;border-color:transparent;box-shadow:var(--glow-acc)}
.btn-lg{min-height:58px;font-size:17px;font-family:var(--f-display);border-radius:18px}
.btn-lg.btn-primary::after,.btn-lg.btn-accent::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}85%,100%{left:130%}}
.btn-block{width:100%}
.btn-sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 2px rgba(18,35,77,.06);transition:transform .2s var(--ease)}
.back:hover{transform:translateX(3px)}
.back svg{stroke:var(--fg)}

/* forms */
.label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.input,.textarea,.select{width:100%;min-height:52px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);padding:10px 14px;outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s,background .2s}
.textarea{resize:vertical;min-height:76px;line-height:1.6}
.input:focus,.textarea:focus{border-color:var(--caramel);box-shadow:var(--ring);background:var(--surface)}
.input.ltr{direction:ltr;text-align:left;letter-spacing:.06em;font-family:var(--f-display)}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:6px 0 0;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s}
.chip:hover{border-color:var(--caramel)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--btn);color:#fff;border-color:transparent;box-shadow:var(--glow)}
:root[data-theme="dark"] .chip.on{color:#0B1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0B1530}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.p-good{color:var(--good);background:var(--good-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}
.p-info{color:var(--fg);background:var(--info-soft)}.p-acc{color:var(--accent);background:var(--accent-soft)}.p-mute{color:var(--muted);background:var(--surface2)}

.carbar{position:relative;overflow:hidden;background:var(--hero);color:#FFF8EE;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh1)}
.carbar .k{font-size:12px;opacity:.8}
.carbar .v{font-family:var(--f-display);font-weight:700;font-size:17px}
.carbar button{background:var(--btn-acc);color:#2A1404;border:0;border-radius:12px;min-height:40px;padding:0 16px;font-weight:700;box-shadow:var(--glow-acc);transition:transform .2s var(--ease)}
.carbar button:hover{transform:translateY(-1px)}
.photo{width:76px;height:76px;border-radius:14px;background:var(--surface2);object-fit:cover;flex-shrink:0;box-shadow:var(--sh1)}
.drop{min-height:88px;border-radius:16px;border:2px dashed color-mix(in srgb,var(--caramel) 55%,var(--line));background:color-mix(in srgb,var(--accent-soft) 45%,var(--bg));display:flex;align-items:center;justify-content:center;gap:10px;color:var(--accent);font-weight:600;font-size:14px;width:100%;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.drop:hover{background:var(--accent-soft);transform:translateY(-1px)}
.drop svg{stroke:currentColor}

/* offers */
.offer{position:relative;background:var(--surface);border-radius:20px;padding:13px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;box-shadow:var(--sh1);transition:transform .25s var(--ease),box-shadow .25s}
.offer:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.offer.best{border-color:var(--caramel);box-shadow:var(--sh1),0 0 0 5px color-mix(in srgb,var(--caramel) 18%,transparent)}
.offer .price{font-family:var(--f-display);font-weight:700;font-size:23px;white-space:nowrap;color:var(--fg)}
.thumb{width:68px;height:68px;border-radius:16px;background:linear-gradient(145deg,var(--surface2),var(--accent-soft));display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--accent)}
.thumb img{width:82%;height:82%;object-fit:contain}
.thumb img.cover{width:100%;height:100%;object-fit:cover}
.waiting{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;border-radius:18px;border:2px dashed var(--line);color:var(--muted);font-size:13px;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--caramel);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:300px}
.b{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word}
.chat>.fresh{animation:bin .4s var(--spring) both}
@keyframes bin{from{opacity:0;transform:translateY(8px) scale(.97)}}
.b.me{align-self:flex-start;background:var(--btn);color:#fff;border-end-start-radius:5px;box-shadow:var(--glow)}
:root[data-theme="dark"] .b.me{color:#0B1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b.me{color:#0B1530}}
.b.them{align-self:flex-end;background:var(--surface);border-end-end-radius:5px;box-shadow:var(--sh1)}
.b.sys{align-self:center;background:var(--surface2);font-size:12px;color:var(--muted);text-align:center}
.b img{display:block;max-width:180px;border-radius:12px;margin-top:4px}
.b .meta{display:block;font-size:11px;opacity:.7;margin-top:2px}
.ocard{align-self:flex-end;width:min(280px,88%);background:var(--surface);border:2px solid var(--caramel);border-radius:18px;padding:12px;box-shadow:var(--sh1)}
.composer{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 75%,transparent);padding:10px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.qr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qr button{flex-shrink:0;min-height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;padding:0 12px;white-space:nowrap}

.track{display:flex;gap:6px}
.track div{flex:1 1 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.track span{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track .on span{background:var(--btn-acc)}
.track em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .on em{color:var(--fg);font-weight:700}
.mapbox{border-radius:20px;overflow:hidden;background:var(--surface2);box-shadow:var(--sh1)}
.mapbox svg{display:block;width:100%;height:auto}
.code{font-family:var(--f-display);font-weight:700;font-size:36px;letter-spacing:.2em;direction:ltr;background:var(--btn-acc);-webkit-background-clip:text;background-clip:text;color:transparent}

.stars{display:flex;gap:8px;justify-content:center}
.stars button{width:56px;height:56px;border-radius:18px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh1);transition:transform .2s var(--spring)}
.stars button:hover{transform:translateY(-3px) rotate(-6deg)}
.stars button:active{transform:scale(.88)}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,15,34,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:540px;max-height:86vh;background:var(--bg);border-radius:28px 28px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overflow:hidden;box-shadow:var(--sh2);animation:up .4s var(--ease) both}
.sheet::before{content:"";align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.sheet .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{min-height:var(--tile,76px);border-radius:16px;border:2px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:14px;box-shadow:var(--sh1);transition:transform .2s var(--ease),border-color .2s}
.tile:hover{transform:translateY(-2px)}
.tile .en{font-family:var(--f-display);font-size:10px;letter-spacing:.08em;color:var(--accent);direction:ltr}
.bb{display:grid;place-items:center;width:100%;height:44px;margin-bottom:6px;padding:4px 12px}
.bb img{max-width:100%;max-height:100%;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 2px 6px rgba(0,0,0,.5));opacity:.92;transition:filter .3s,opacity .3s,transform .3s var(--ease)}
.tile:hover .bb img{opacity:1;transform:scale(1.06)}
.tile.sel .bb img{filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));opacity:1}
body:not(.mapmode) .bb img{filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.tile .en{display:none}
.tile.sel{border-color:var(--caramel);box-shadow:var(--sh1),var(--ring)}

/* ---------- mascot ---------- */
.mascot{position:relative;display:grid;place-items:center;width:var(--ms,250px);height:var(--ms,250px);margin:0 auto;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mascot .rays{position:absolute;inset:-6%;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--caramel) 30%,transparent) 0 9deg,transparent 9deg 22deg);
  -webkit-mask-image:radial-gradient(circle,#000 30%,transparent 68%);mask-image:radial-gradient(circle,#000 30%,transparent 68%);animation:spin 40s linear infinite}
.mascot .disc{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE2B8,#F3C38A 55%,#E7A35C);box-shadow:inset 0 -10px 24px rgba(164,85,26,.35),0 20px 40px -18px rgba(164,85,26,.6)}
.mascot .orbit{position:absolute;inset:-2%;border-radius:50%;animation:spin 26s linear infinite}
.mascot .orbit span{position:absolute;width:13%;aspect-ratio:1;display:grid;place-items:center;border-radius:30%;background:var(--surface);box-shadow:var(--sh1);animation:spin 26s linear infinite reverse}
.mascot .orbit span img{width:72%;height:72%;object-fit:contain}
.mascot .orbit span:nth-child(1){top:2%;left:50%;margin-left:-7.5%}
.mascot .orbit span:nth-child(2){top:50%;right:-3%;margin-top:-7.5%}
.mascot .orbit span:nth-child(3){bottom:2%;left:50%;margin-left:-7.5%}
.mascot .orbit span:nth-child(4){top:50%;left:-3%;margin-top:-7.5%}
.mascot .body{position:relative;width:78%;transform:translate(calc(var(--mx,0) * 10px),calc(var(--my,0) * 8px)) rotateY(calc(var(--mx,0) * 14deg));transition:transform .4s var(--ease);transform-style:preserve-3d}
.mascot .fig{display:block;width:100%;height:auto;transform-origin:50% 92%;animation:float 4.2s ease-in-out infinite;filter:drop-shadow(0 16px 18px rgba(18,35,77,.28))}
.mascot .shadow{position:absolute;bottom:4%;left:50%;width:46%;height:7%;margin-left:-23%;border-radius:50%;background:radial-gradient(rgba(18,35,77,.35),transparent 70%);animation:shadow 4.2s ease-in-out infinite}
.mascot .bubble{position:absolute;top:2%;right:-6%;z-index:3;max-width:62%;background:var(--surface);color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:13px;line-height:1.45;padding:8px 12px;border-radius:16px 16px 4px 16px;box-shadow:var(--sh2);opacity:0;transform:scale(.6) translateY(10px);transform-origin:100% 100%;transition:opacity .25s,transform .35s var(--spring);pointer-events:none}
.mascot .bubble.on{opacity:1;transform:none}
.mascot .pulse{position:absolute;inset:18%;border-radius:50%;border:2px solid var(--caramel);opacity:0}
.mascot.search .pulse{animation:radar 2.4s ease-out infinite}
.mascot.search .pulse:nth-of-type(2){animation-delay:.8s}
.mascot.search .pulse:nth-of-type(3){animation-delay:1.6s}
.mascot.search .fig{animation:sway 1.8s ease-in-out infinite}
.mascot.happy .fig{animation:hop .9s var(--ease) 2,float 4.2s ease-in-out .9s infinite}
.mascot.jump .fig{animation:jump .85s var(--ease)}
.mascot.wave .fig{animation:wiggle .9s ease-in-out,float 4.2s ease-in-out .9s infinite}
.mascot.sm{--ms:120px}.mascot.sm .orbit,.mascot.sm .rays{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.72);opacity:.55}}
@keyframes sway{0%,100%{transform:rotate(-6deg) translateY(-4px)}50%{transform:rotate(6deg) translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(4px) scale(1.06,.92)}45%{transform:translateY(-34px) scale(.96,1.05) rotate(-4deg)}75%{transform:translateY(0) scale(1.04,.95)}}
@keyframes jump{0%{transform:none}15%{transform:translateY(6px) scale(1.1,.88)}50%{transform:translateY(-46px) rotate(-360deg) scale(.95,1.06)}80%{transform:translateY(0) rotate(-360deg) scale(1.06,.92)}100%{transform:rotate(-360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}60%{transform:rotate(2.5deg)}}
@keyframes radar{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.6);opacity:0}}

}

  's-otp': function () {

document.addEventListener('click', function (ev) {

});
document.addEventListener('submit', function (ev) {
  var f = ev.target.getAttribute('data-form'); if (!f) return; ev.preventDefault();

  if (f === 's-msg') shopSend(S.s.draft);
  if (f === 'a-unlock') {
    var a = S.a;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email.trim())) a.err = 'اكتب بريد صحيح.';
    else if (a.pin !== '0000') { a.err = 'الرمز غلط. هذي اللوحة للفريق بس.'; a.pin = ''; }
    else { a.err = ''; a.unlocked = true; a.tab = { CFO: 'shops', COO: 'shops', CSO: 'shops', CHRO: 'chats' }[a.role] || 'overview'; }
    render();

});
document.addEventListener('input', function (ev) {
  var el = ev.target, b = el.getAttribute && el.getAttribute('data-bind'); if (!b) return;
  var v = el.value;
  if (el.dataset.digits) { v = digits(v).slice(0, Number(el.dataset.digits)); if (v !== el.value) el.value = v; }
  if (el.dataset.dec) { v = dec(v).slice(0, 9); if (v !== el.value) el.value = v; }
  var parts = b.split('.'), o = S; for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]]; o[parts[parts.length - 1]] = v;
  if (b === 'd.part') { var c = catOf(v); var nc = c ? c.id : S.d.cat; if (nc !== S.d.cat) { S.d.cat = nc; MapCtl.hatch(nc); } }
  if (el.dataset.live) render();
});
document.addEventListener('change', function (ev) {
  var el = ev.target, who = el.getAttribute && el.getAttribute('data-file'); if (!who || !el.files || !el.files[0]) return;
