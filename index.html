<title>وينه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow phone column for driver and shop, a wide grid for the team panel. Navy + brown on paper. */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --surface2:#E9E2D4; --fg:#1B2A4A; --muted:#5B6475; --line:#DDD5C6;
  --primary:#1B2A4A; --on-primary:#F4F2EC; --accent:#8B5A2B; --accent-soft:#F4EBDF; --caramel:#C8925A;
  --good:#2F6B3A; --good-soft:#E3EFE4; --bad:#A33A2A; --bad-soft:#F6E1DD; --info-soft:#E6EAF2; --shadow:rgba(15,17,21,.14);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif; --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161F; --surface:#1A2130; --surface2:#232C3D; --fg:#ECE8DF; --muted:#A3ABBA; --line:#2E384B;
  --primary:#C8925A; --on-primary:#11161F; --accent:#D9A46B; --accent-soft:#33291F; --caramel:#C8925A;
  --good:#7FC48C; --good-soft:#1E3326; --bad:#E58A7A; --bad-soft:#3A2220; --info-soft:#243047; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161F; --surface:#1A2130; --surface2:#232C3D; --fg:#ECE8DF; --muted:#A3ABBA; --line:#2E384B;
  --primary:#C8925A; --on-primary:#11161F; --accent:#D9A46B; --accent-soft:#33291F; --caramel:#C8925A;
  --good:#7FC48C; --good-soft:#1E3326; --bad:#E58A7A; --bad-soft:#3A2220; --info-soft:#243047; --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}

/* test switcher */
.switch{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;justify-content:center;padding:10px 0;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.switch a{flex:0 1 auto;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.switch a[aria-current="page"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.mode{font-size:11px;text-align:center;color:var(--muted);margin:-4px 0 6px}
.mode b{color:var(--accent)}

.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wide{max-width:1180px;margin:0 auto}
.card{background:var(--surface);border-radius:18px;padding:16px}
.soft{background:var(--surface2);border-radius:18px;padding:14px 16px}
.hero{background:var(--primary);color:var(--on-primary);border-radius:22px;padding:18px;display:flex;align-items:flex-end;gap:12px;overflow:hidden;min-height:118px}
.hero .t{font-family:var(--f-display);font-weight:600;font-size:18px}
.hero p{margin:4px 0 0;font-size:13px;opacity:.82}
.hero img{width:74px;height:auto;margin-bottom:-22px;flex-shrink:0}

.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-accent{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
.btn-lg{min-height:56px;font-size:17px;font-family:var(--f-display);border-radius:16px}
.btn-block{width:100%}
.btn-sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.back svg{stroke:var(--fg)}

.label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.input,.textarea,.select{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);padding:10px 14px;outline:none;font-size:16px}
.textarea{resize:vertical;min-height:72px;line-height:1.6}
.input:focus,.textarea:focus{border-color:var(--primary)}
.input.ltr{direction:ltr;text-align:left;letter-spacing:.06em;font-family:var(--f-display)}
.err{color:var(--bad);font-size:13px;font-weight:500;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:4px;background:currentColor}
.p-good{color:var(--good);background:var(--good-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}
.p-info{color:var(--fg);background:var(--info-soft)}.p-acc{color:var(--accent);background:var(--accent-soft)}.p-mute{color:var(--muted);background:var(--surface2)}

.carbar{background:var(--primary);color:var(--on-primary);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.carbar .k{font-size:12px;opacity:.75}
.carbar .v{font-family:var(--f-display);font-weight:600;font-size:16px}
.carbar button{background:var(--caramel);color:#1B2A4A;border:0;border-radius:12px;min-height:40px;padding:0 14px;font-weight:700}
.photo{width:76px;height:76px;border-radius:12px;background:var(--surface2);object-fit:cover;flex-shrink:0}
.drop{min-height:84px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:14px;width:100%}

.offer{background:var(--surface);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent}
.offer.best{border-color:var(--accent)}
.offer .price{font-family:var(--f-display);font-weight:700;font-size:21px;white-space:nowrap}
.thumb{width:68px;height:68px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:22px}
.thumb img{width:82%;height:82%;object-fit:contain}
.thumb img.cover{width:100%;height:100%;object-fit:cover}
.waiting{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;border-radius:16px;border:2px dashed var(--line);color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:4px;background:var(--accent);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

.chat{display:flex;flex-direction:column;gap:8px;min-height:300px}
.b{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.6;word-wrap:break-word}
.b.me{align-self:flex-start;background:var(--primary);color:var(--on-primary);border-end-start-radius:4px}
.b.them{align-self:flex-end;background:var(--surface);border-end-end-radius:4px}
.b.sys{align-self:center;background:var(--surface2);font-size:12px;color:var(--muted);text-align:center}
.b img{display:block;max-width:180px;border-radius:10px;margin-top:4px}
.b .meta{display:block;font-size:11px;opacity:.65;margin-top:2px}
.ocard{align-self:flex-end;width:min(270px,88%);background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.qr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.qr button{flex-shrink:0;min-height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;padding:0 12px;white-space:nowrap}

.track{display:flex;gap:6px}
.track div{flex:1 1 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.track span{height:5px;border-radius:3px;background:var(--line)}
.track .on span{background:var(--accent)}
.track em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .on em{color:var(--fg);font-weight:600}
.mapbox{border-radius:18px;overflow:hidden;background:var(--surface2)}
.mapbox svg{display:block;width:100%;height:auto}
.code{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.2em;direction:ltr}

.stars{display:flex;gap:8px;justify-content:center}
.stars button{width:54px;height:54px;border-radius:16px;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,17,21,.45)}
.sheet{width:100%;max-width:520px;max-height:86vh;background:var(--bg);border-radius:24px 24px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sheet .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{min-height:76px;border-radius:14px;border:2px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:14px}
.tile .en{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;color:var(--accent);direction:ltr}
.tile.sel{border-color:var(--accent)}
.li{min-height:54px;border-radius:14px;border:2px solid transparent;background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 14px;text-align:right;width:100%}
.li.sel{border-color:var(--accent)}

.banner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;width:min(440px,calc(100% - 24px));border:0;border-radius:20px;background:var(--surface);box-shadow:0 12px 30px var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:right;animation:drop .5s cubic-bezier(.2,.9,.3,1.2) both}
.banner img{width:40px;height:40px;border-radius:11px;background:var(--primary);object-fit:contain}
@keyframes drop{from{opacity:0;transform:translate(-50%,-120%)}to{opacity:1;transform:translate(-50%,0)}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;background:#0F1115;color:#F4F2EC;border-radius:14px;padding:11px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.bob,.pop,.banner,.dots i{animation:none}}

/* admin */
.adm{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.adm aside{flex:1 1 220px;max-width:100%;background:var(--primary);color:var(--on-primary);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.adm aside button{min-height:44px;border-radius:12px;border:0;background:transparent;color:inherit;text-align:right;padding:0 12px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:.85}
.adm aside button[aria-current="page"]{background:var(--bg);color:var(--fg);opacity:1}
.adm main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:16px;padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.bar{height:12px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--fg)}
.tbl{overflow-x:auto}
.tbl table{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--surface2)}
.two{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.two>*{flex:1 1 320px;min-width:0}
.feed{display:flex;flex-direction:column;gap:6px;max-height:360px;overflow-y:auto}
.feed div{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px}
.flag{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}
.empty img{width:76px;height:auto;margin-bottom:8px}
</style>

  'd-home': function () { S.d.view = 'home'; S.d.err = ''; S.d.part = S.d.view === 'thanks' ? '' : S.d.part; },
  'd-car': function () { S.d.sheet = true; S.d.cs = { step: 'brand', brand: null, model: null, q: '' }; },
  'd-cs-close': function () { S.d.sheet = false; },
  'd-cs-close-bg': function (el, ev) { if (ev.target === el) S.d.sheet = false; else return false; },
  'd-cs-back': function () { var cs = S.d.cs; cs.step = cs.step === 'year' ? 'model' : 'brand'; cs.q = ''; },
  'd-cs-brand': function (el) { S.d.cs.brand = el.dataset.v; S.d.cs.step = 'model'; S.d.cs.q = ''; },
  'd-cs-model': function (el) { S.d.cs.model = el.dataset.v; S.d.cs.step = 'year'; },
  'd-cs-year': function (el) { var b = CARS.filter(function (c) { return c.id === S.d.cs.brand; })[0]; me.car = { brand: b.id, brandAr: b.ar, model: S.d.cs.model, year: Number(el.dataset.v) }; saveMe(); S.d.sheet = false; },
  'd-part-chip': function (el) { S.d.part = el.dataset.v; S.d.err = ''; },
  'd-tag': function (el) { var t = S.d.tags, v = el.dataset.v; S.d.tags = t.indexOf(v) >= 0 ? t.filter(function (x) { return x !== v; }) : t.concat([v]); },
  'd-photo-del': function () { S.d.photo = null; },
  'd-submit': function () {
    var d = S.d; if (!d.part.trim()) { d.err = 'اكتب اسم القطعة أول.'; return; }
    var id = 'r' + uid(), code = newCode();
    var doc = { code: code, car: me.car, part: d.part.trim(), note: d.note.trim(), tags: d.tags.slice(), photo: d.photo || null, status: 'open', createdAt: now(), offers: {}, msgs: {}, chosen: null, finalPrice: null, declined: {} };
    Store.set('requests/' + id, doc).then(function () { runDemoShops(id, doc.part); });
    me.reqs = [id].concat(me.reqs).slice(0, 30); saveMe();
    d.rid = id; d.view = 'offers'; d.part = ''; d.photo = null; d.tags = []; d.note = ''; d.err = ''; d.sort = 'cheap';
  },
  'd-open': function (el) { var r = reqById(el.dataset.id); S.d.rid = el.dataset.id; S.d.sid = r && r.chosen; S.d.view = r && r.chosen && r.status !== 'open' ? 'booked' : 'offers'; },
  'd-sort': function (el) { S.d.sort = { 'الأرخص': 'cheap', 'الأقرب': 'near', 'الأعلى تقييم': 'rate' }[el.dataset.v]; },
  'd-cancel': function (el) { Store.merge('requests/' + el.dataset.id, { status: 'cancelled' }); S.d.view = 'home'; toast('ألغينا الطلب.'); },
  'd-offers': function () { S.d.view = 'offers'; },
  'd-choose': function (el) { S.d.sid = el.dataset.sid; S.d.view = 'chat'; S.d.draft = ''; S._scroll = true; },
  'd-quick': function (el) { driverSend(el.dataset.v); return false; },
  'd-book': function (el) {
    var d = S.d, price = Number(el.dataset.price), r = reqById(d.rid); if (!r || r.status !== 'open') return;
    Store.merge('requests/' + d.rid, { status: 'booked', chosen: d.sid, finalPrice: price, bookedAt: now() }).then(function () { return addMsg(d.rid, { from: 'x', shopId: d.sid, kind: 'booking', price: price }); });
    toast('تم الحجز. رقم حجزك W-' + r.code); S._scroll = true;
  },
  'd-booked': function () { S.d.view = 'booked'; },
  'd-chat': function () { var r = reqById(S.d.rid); S.d.sid = (r && r.chosen) || S.d.sid; S.d.view = 'chat'; S._scroll = true; },
  'd-arrived': function () {
    var d = S.d, r = reqById(d.rid); if (!r) return;
    Store.merge('requests/' + d.rid, { status: 'arrived', arrivedAt: now() });
    if (r.chosen && r.chosen.indexOf('demo-') === 0) setTimeout(function () { Store.merge('requests/' + d.rid, { status: 'done', handedAt: now() }); S.d.banner = 'المحل أكّد إنك استلمت قطعتك. كيف كانت التجربة؟'; render(); setTimeout(function () { S.d.banner = null; render(); }, 7000); }, 4000);
  },
  'd-review': function () { S.d.view = 'review'; S.d.stars = 0; S.d.rtags = []; S.d.comment = ''; S.d.err = ''; S.d.banner = null; },
  'd-star': function (el) { S.d.stars = Number(el.dataset.v); S.d.err = ''; },
  'd-rtag': function (el) { var t = S.d.rtags, v = el.dataset.v; S.d.rtags = t.indexOf(v) >= 0 ? t.filter(function (x) { return x !== v; }) : t.concat([v]); },
  'd-send-review': function () { var d = S.d; if (!d.stars) { d.err = 'اختر عدد النجوم.'; return; } Store.merge('requests/' + d.rid, { review: { stars: d.stars, tags: d.rtags, comment: guard(d.comment.trim()).text, at: now() } }); d.view = 'thanks'; },
  /* shop */
  's-intro': function () { S.s.view = 'intro'; S.s.err = ''; },
  's-reg': function () { S.s.view = 'reg'; S.s.err = ''; },
  's-type': function (el) { S.s.reg.type = el.dataset.v; S.s.err = ''; },
  's-cat': function (el) { var t = S.s.reg.cats, v = el.dataset.v; S.s.reg.cats = t.indexOf(v) >= 0 ? t.filter(function (x) { return x !== v; }) : t.concat([v]); },
  's-brand': function (el) { var t = S.s.reg.brands, v = el.dataset.v; S.s.reg.brands = t.indexOf(v) >= 0 ? t.filter(function (x) { return x !== v; }) : t.concat([v]); },
  's-reg-next': function () { var r = S.s.reg; if (!r.name.trim()) { S.s.err = 'اكتب اسم المحل.'; return; } if (!r.type) { S.s.err = 'اختر نوع النشاط.'; return; } if (!r.cats.length) { S.s.err = 'اختر قسم واحد على الأقل.'; return; } S.s.err = ''; S.s.view = 'otp'; },
  's-otp': function () {
    var r = S.s.reg;
    if (!r.sent) { if (r.phone.length !== 8) { S.s.err = r.phone ? 'رقم عُمان لازم يكون 8 أرقام.' : 'اكتب رقم المحل.'; return; } S.s.err = ''; r.sent = true; setTimeout(function () { S.s.banner = 'رمز تأكيد محلك: 0000. اضغط هنا لتعبئته.'; render(); }, 1300); return; }
    if (r.code !== '0000') { S.s.err = 'الرمز غلط. جرّب مرة ثانية.'; r.code = ''; return; }
    var id = 's' + uid();
    Store.set('shops/' + id, { name: r.name.trim(), type: r.type, area: 'صناعية المعبيلة', cats: r.cats, brands: r.brands, phoneLast4: r.phone.slice(-4), plan: 'founder', createdAt: now() });
    myShop.id = id; LS.set('waynah.shop', myShop); S.s.banner = null; S.s.err = ''; S.s.view = 'plan';
  },
  's-banner': function () { if (S.s.view === 'otp') S.s.reg.code = '0000'; S.s.banner = null; },
  's-dash': function () { S.s.view = 'dash'; S.s.err = ''; S.s.pickup = ''; },
  's-tab': function (el) { S.s.tab = el.dataset.v; },
  's-logout': function () { myShop.id = null; LS.set('waynah.shop', myShop); S.s.view = 'intro'; S.s.reg = { name: '', type: '', cats: [], brands: [], phone: '', code: '', sent: false }; },
  's-open': function (el) { S.s.rid = el.dataset.id; S.s.offer = { cond: 'أصلي مستعمل', price: '', avail: 'موجودة الحين', note: '', photo: null }; S.s.err = ''; S.s.pickup = ''; S.s.view = 'req'; S._scroll = true; },
  's-cond': function (el) { S.s.offer.cond = el.dataset.v; },
  's-avail': function (el) { S.s.offer.avail = el.dataset.v; },
  's-photo-del': function () { S.s.offer.photo = null; },
  's-send-offer': function () {
    var s = S.s, o = s.offer, shop = Shop.me(), price = Number(o.price);
    if (!price) { s.err = 'اكتب السعر بالأرقام.'; return; }
    var g = guard(o.note.trim());
    var x = {}; x[shop.id] = { shopName: shop.name, price: price, cond: o.cond, avail: o.avail, note: g.text, img: o.photo || null, at: now() };
    Store.merge('requests/' + s.rid, { offers: x }); s.err = ''; s.view = 'chat'; toast('وصل عرضك للزبون.');
  },
  's-decline': function () { var x = {}; x[myShop.id] = true; Store.merge('requests/' + S.s.rid, { declined: x }); S.s.view = 'dash'; toast('تمام، شلنا الطلب من قائمتك.'); },
  's-quick': function (el) { shopSend(el.dataset.v); return false; },
  's-newprice': function () { var p = Number(S.s.draft); if (!p) { toast('اكتب السعر الجديد في خانة الرسالة، وبعدين اضغط «اقترح سعر جديد».'); return false; } addMsg(S.s.rid, { from: 's', shopId: myShop.id, kind: 'offer', price: p }); S.s.draft = ''; S._scroll = true; },
  's-handover': function () {
    var s = S.s, r = reqById(s.rid); if (!r) return;
    if (s.pickup !== r.code) { s.err = 'الرقم ما يطابق. تأكد من شاشة الزبون.'; s.pickup = ''; return; }
    Store.merge('requests/' + s.rid, { status: 'done', handedAt: now() }); s.err = ''; s.pickup = ''; toast('تم التسليم. انفتح التقييم للزبون.');
  },
  /* admin */
  'a-role': function (el) { S.a.role = el.dataset.v; },
  'a-tab': function (el) { S.a.tab = el.dataset.v; S.a.confirm = false; },
  'a-lock': function () { S.a.unlocked = false; S.a.pin = ''; },
  'a-sel': function (el) { S.a.sel = el.dataset.v; },
  'a-demo': function () { var on = D.config.demoShops !== false; Store.set('config/main', { demoShops: !on }); toast(on ? 'وقفنا المحلات التجريبية.' : 'شغّلنا المحلات التجريبية.'); },
  'a-wipe-ask': function () { S.a.confirm = true; },
  'a-wipe-cancel': function () { S.a.confirm = false; },
  'a-wipe': function () { D.requests.forEach(function (r) { Store.del('requests/' + r.id); }); D.shops.forEach(function (s) { Store.del('shops/' + s.id); }); S.a.confirm = false; toast('مسحنا بيانات التجربة.'); }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var f = A[el.dataset.act]; if (!f) return;
  var res = f(el, ev);
  if (res !== false) render();
});
document.addEventListener('submit', function (ev) {
  var f = ev.target.getAttribute('data-form'); if (!f) return; ev.preventDefault();
  if (f === 'd-msg') driverSend(S.d.draft);
  if (f === 's-msg') shopSend(S.s.draft);
  if (f === 'a-unlock') {
    var a = S.a;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email.trim())) a.err = 'اكتب بريد صحيح.';
    else if (a.pin !== '0000') { a.err = 'الرمز غلط. هذي اللوحة للفريق بس.'; a.pin = ''; }
    else { a.err = ''; a.unlocked = true; a.tab = { CFO: 'shops', COO: 'shops', CSO: 'shops', CHRO: 'chats' }[a.role] || 'overview'; }
    render();
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target, b = el.getAttribute && el.getAttribute('data-bind'); if (!b) return;
  var v = el.value;
  if (el.dataset.digits) { v = digits(v).slice(0, Number(el.dataset.digits)); if (v !== el.value) el.value = v; }
  if (el.dataset.dec) { v = dec(v).slice(0, 9); if (v !== el.value) el.value = v; }
  var parts = b.split('.'), o = S; for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]]; o[parts[parts.length - 1]] = v;
  if (el.dataset.live) render();
});
document.addEventListener('change', function (ev) {
  var el = ev.target, who = el.getAttribute && el.getAttribute('data-file'); if (!who || !el.files || !el.files[0]) return;
  resizeImage(el.files[0], 640, function (url) {
    if (Store.remote) toast('جاري رفع الصورة…');
    Store.upload(url).then(function (u) { if (!u) return; if (who === 'd') S.d.photo = u; else S.s.offer.photo = u; render(); });
  });
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') { if (S.d.sheet || S.d.picker) { S.d.sheet = false; S.d.picker = false; render(); } } });
window.addEventListener('hashchange', render);
setInterval(function () { if (!document.activeElement || ['INPUT', 'TEXTAREA'].indexOf(document.activeElement.tagName) < 0) render(); }, 30000);

/* ---------------- boot ---------------- */
render();
Store.init().then(function () {
  var pending = 3, done = function () { if (--pending <= 0 && !D.ready) { D.ready = true; } render(); };
  Store.watchCol('requests', function (list) { D.requests = list; if (S.d.view === 'chat' || S.s.view === 'chat') S._scroll = true; done(); });
  Store.watchCol('shops', function (list) { D.shops = list; done(); });
  Store.watchDoc('config/main', function (c) { D.config = c || { demoShops: true }; done(); });
});
})();
</script>
