<title>مقر وينه</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a 3D isometric office fills the screen (eight team rooms around the shared brain); the top bar switches views, a side panel opens for a team, a person, the task board, the calendar or the brain, and the command dock talks to Rashid. One committed night look. */
:root{
  color-scheme:dark;
  --bg:#090E1F; --glass:rgba(13,19,40,.86); --card:#121A35; --card-2:#18224A;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --fg:#F2EEE6; --muted:#A3ADC8; --dim:#6E7893;
  --caramel:#F29B3F; --caramel-2:#FFC37A; --cyan:#7FE7FF;
  --good:#3DD68C; --warn:#FFB347; --bad:#FF6B5B; --review:#B18CFF;
  --display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--caramel-2);outline-offset:2px;border-radius:8px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;will-change:transform}
.rlab{display:flex;align-items:center;gap:7px;background:rgba(10,15,32,.86);border:1px solid var(--line-2);border-radius:10px;padding:4px 9px 4px 7px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:12px}
.rlab .ic{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
.rlab .ic svg{width:13px;height:13px}
.rlab b{font-family:var(--display);font-weight:600;font-size:12.5px}
.rlab small{display:block;color:var(--muted);font-size:10.5px;line-height:1.2}
.rlab .dotr{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-inline-end:4px}
.rlab .dotr.off{background:#5B6684}
.rlab.hot{border-color:rgba(255,195,122,.6);box-shadow:0 0 0 3px rgba(242,155,63,.18),0 8px 24px rgba(0,0,0,.35)}
.blab{text-align:center;background:rgba(10,15,32,.82);border:1px solid rgba(127,231,255,.35);border-radius:10px;padding:4px 10px;font-size:11px;color:#CFF6FF}
.blab b{display:block;font-family:var(--display);font-size:12px;color:#fff}
.plab{font-size:11px;background:rgba(10,15,32,.85);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;visibility:hidden}
.plab.on{visibility:visible}
.plab i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(9,14,31,.95),rgba(9,14,31,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 12px}
.brand .crest{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--caramel-2),var(--caramel) 55%,#B8591A);display:grid;place-items:center}
.brand b{font-family:var(--display);font-size:16px}
.brand small{color:var(--muted);font-size:11px;display:block;line-height:1.1}
.views{display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;margin-inline:auto}
.views button{border:0;background:none;border-radius:8px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.views button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.views .n{font-size:10.5px;background:rgba(177,140,255,.25);color:#E3D6FF;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.askany{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:0 10px;height:40px;width:210px}
.askany input{border:0;background:none;outline:0;width:100%;font-size:13px}
.askany input::placeholder{color:var(--dim)}
.live{display:flex;align-items:center;gap:7px;background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.3);color:#BFF3D6;border-radius:12px;padding:0 12px;height:40px;font-size:12.5px;font-weight:600;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(61,214,140,0)}0%{box-shadow:0 0 0 0 rgba(61,214,140,.6)}}
.side{position:fixed;z-index:25;top:calc(64px + env(safe-area-inset-top,0px));bottom:16px;right:max(16px,env(safe-area-inset-right,0px));width:400px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.3,.7,.2,1);overflow:hidden}
.side.open{transform:none}
.shead{display:flex;align-items:center;gap:11px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--line)}
.shead .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.shead .ic svg{width:20px;height:20px}
.shead h2{margin:0;font-family:var(--display);font-size:17px;line-height:1.25}
.shead .sub{color:var(--muted);font-size:12px}
.x{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.sbody{flex:1;overflow-y:auto;min-height:0;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sec h3{margin:0 0 8px;font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.stat small{color:var(--muted);font-size:11px;display:block}
.stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat svg{display:block;width:100%;height:18px;margin-top:2px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.tool .tl{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;flex:none;color:#0B1022}
.tool b{font-size:12.5px;display:block;line-height:1.2}
.tool small{font-size:10.5px;color:var(--muted)}
.tool small.on{color:var(--good)}
.grow{flex:1;min-width:0}
.person{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;width:100%;text-align:start}
.person:hover{border-color:var(--line-2)}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#0B1022;position:relative}
.av.sleep::after{content:"z";position:absolute;top:-6px;left:-4px;font-size:11px;color:#C9D6FF;font-weight:700}
.person b{font-size:13px}
.person small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead{font-size:9.5px;font-weight:700;background:rgba(255,195,122,.15);color:var(--caramel-2);border-radius:5px;padding:1px 5px;margin-inline-start:5px;vertical-align:middle}
.st{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.working{background:rgba(255,179,71,.15);color:var(--warn)}
.st.review{background:rgba(177,140,255,.16);color:var(--review)}
.st.done{background:rgba(61,214,140,.14);color:var(--good)}
.st.error,.st.stopped{background:rgba(255,107,91,.14);color:var(--bad)}
.st.idle{background:rgba(255,255,255,.06);color:var(--dim)}
.skills{display:flex;flex-direction:column;gap:6px}
.skill{display:flex;align-items:center;gap:9px;font-size:12.5px}
.skill .bar{flex:0 0 90px;height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:5px}
.skill .pc{font-size:10.5px;color:var(--dim);width:34px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04)}
.taste{margin:0;padding-inline-start:18px;color:#D8D2C6;font-size:13px}
.taste li{margin:3px 0}
textarea{width:100%;resize:none;background:#0A1024;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;line-height:1.55;min-height:44px}
textarea::placeholder{color:var(--dim)}
.btn{border:1px solid var(--line-2);background:rgba(255,255,255,.06);padding:7px 13px;border-radius:10px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-acc{background:linear-gradient(135deg,var(--caramel-2),var(--caramel) 55%,#C8661F);color:#2A1404;border-color:transparent}
.btn-ok{background:rgba(61,214,140,.16);border-color:rgba(61,214,140,.45);color:#C9F7DE}
.check{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted)}
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ftabs button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.ftabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--line-2);background:var(--card-2)}
.grp{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:4px}
.grp i{width:7px;height:7px;border-radius:50%}
.task{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.task>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:9px 11px;cursor:pointer}
.task>summary::-webkit-details-marker{display:none}
.task .tt{font-weight:600;font-size:13px;line-height:1.35;display:block}
.task .meta{font-size:11px;color:var(--dim)}
.ring{width:26px;height:26px;flex:none}
.ring circle{fill:none;stroke-width:3}
.ring .spin{transform-origin:50% 50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.task .body{border-top:1px solid var(--line);padding:11px 13px;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.md h4{font-family:var(--display);font-size:13.5px;margin:10px 0 4px;color:var(--caramel-2)}
.md p{margin:5px 0}
.md ul,.md ol{margin:5px 0;padding-inline-start:20px}
.md li{margin:2px 0}
.md code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px;font-family:var(--mono);font-size:11.5px}
.md pre{background:#0A1024;border:1px solid var(--line);border-radius:10px;padding:9px;overflow-x:auto;font-size:11.5px;direction:ltr;text-align:left}
.md table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.md td{border:1px solid var(--line-2);padding:4px 7px;vertical-align:top}
.md tr:first-child td{background:rgba(255,255,255,.05);font-weight:600}
.md strong{color:#fff}
.tw{overflow-x:auto}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.you{flex-direction:row-reverse}
.bub{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;flex:1}
.msg.you .bub{background:#1B2A55;border-color:#2C3F78;flex:0 1 auto}
.bub .who{font-size:11.5px;color:var(--muted);font-weight:600}
.fix{margin-top:8px;border:1px dashed rgba(255,195,122,.45);background:rgba(242,155,63,.07);border-radius:11px;padding:8px 10px;font-size:12.5px}
.fix b{color:var(--caramel-2);font-size:11.5px;display:block}
.fix ul{margin:4px 0 0;padding-inline-start:18px;color:var(--muted)}
.arow{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;width:100%;text-align:start;margin-top:6px}
.arow .t{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:12.5px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:14.5px;margin-bottom:4px}
.note{font-size:12px;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:8px 11px}
.note.warn{color:#FFD9A8;border-color:rgba(255,179,71,.35);background:rgba(255,179,71,.07)}
.memo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.memo small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
.memo .del{background:none;border:0;color:var(--dim);font-size:11.5px;padding:2px 4px;white-space:nowrap}
.memo .del:hover{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 5px;min-height:118px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.today{border-color:rgba(255,195,122,.55)}
.day h5{margin:0;font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.day h5 b{display:block;font-family:var(--display);font-size:15px;color:var(--fg)}
.ev{font-size:10px;line-height:1.3;border-radius:5px;padding:2px 4px;background:rgba(255,255,255,.06);border-inline-start:3px solid var(--c,#888);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.rt{border-inline-start-style:dashed;opacity:.75}
.dock{position:fixed;z-index:22;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);border-radius:18px;padding:8px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.orb{width:42px;height:42px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff 0%,#C9B6FF 18%,#7C5CFF 48%,#2E1F7A 80%);box-shadow:0 0 22px rgba(124,92,255,.55);border:0}
.orb.busy{animation:orb 1.4s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.08);box-shadow:0 0 34px rgba(127,231,255,.8)}}
.dock textarea{background:transparent;border:0;outline:0;min-height:42px;max-height:140px;padding:10px 4px}
.dock .send{height:42px;width:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#5B8CFF,#3A5BD9);border:0;flex:none}
.dock .send:disabled{opacity:.4}
.dock .who{position:absolute;top:-22px;inset-inline-start:14px;font-size:11px;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.tiers{position:fixed;z-index:21;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:4px;font-size:11.5px;align-items:center}
.tiers span{color:var(--dim);padding:0 6px}
.tiers button{border:0;background:none;border-radius:7px;padding:4px 9px;color:var(--muted);font-weight:600}
.tiers button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
.mini{position:fixed;z-index:21;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:6px}
.mini canvas{width:168px;height:112px;display:block;border-radius:9px;background:#0B1124;cursor:pointer}
.mini .zb{display:flex;gap:6px}
.mini .zb button{flex:1;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:#1C2950;border:1px solid var(--line-2);padding:8px 15px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
.boot.out{opacity:0;pointer-events:none}
.boot div{text-align:center;color:var(--muted);font-size:13px}
.boot b{display:block;font-family:var(--display);font-size:22px;color:var(--fg);margin-bottom:6px}
@media (max-width:820px){
  .top{flex-wrap:wrap;gap:8px}
  .brand small,.askany{display:none}
  .views{order:3;margin:0;width:100%;justify-content:space-between}
  .views button{padding:6px 7px;font-size:12.5px}
  .live{height:34px;font-size:11.5px;margin-inline-start:auto}
  .side{top:auto;left:0;right:0;bottom:0;width:auto;height:72vh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none}
  .mini{display:none}
  .tiers{bottom:auto;top:calc(108px + env(safe-area-inset-top,0px))}
  .dock{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  body.sheet .dock{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="gl" aria-label="مكتب وينه ثلاثي الأبعاد: ثمان غرف حول العقل المشترك"></canvas>
<div id="labels"></div>

<header class="top">
  <div class="brand"><span class="crest"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A1404" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg></span><div><b>مقر وينه</b><small>صناعية المعبيلة</small></div></div>
  <nav class="views" aria-label="العرض">
    <button type="button" data-view="office" aria-pressed="true">المكتب</button>
    <button type="button" data-view="tasks" aria-pressed="false">المهام <span class="n" id="n-tasks">0</span></button>
    <button type="button" data-view="calendar" aria-pressed="false">التقويم</button>
    <button type="button" data-view="brain" aria-pressed="false">العقل</button>
    <button type="button" data-view="chief" aria-pressed="false">راشد</button>
  </nav>
  <label class="askany"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="find" list="emps" placeholder="ابحث عن موظف أو قسم…" autocomplete="off"><datalist id="emps"></datalist></label>
  <div class="live"><i></i><span id="live">29 موظف</span></div>
